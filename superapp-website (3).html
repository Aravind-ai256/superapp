*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, #DADFFB 0%, transparent 60%),
    radial-gradient(1000px 700px at 100% 0%, #FFE3D6 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:28px 16px 60px;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- shell chrome (website) ---------- */
#shell{width:100%;max-width:1360px;}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:20px;padding:14px 20px;background:#fff;border-radius:16px;border:1px solid var(--line);flex-wrap:wrap;}
.brandbar .logo{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:19px;color:var(--primary);flex:0 0 auto;}
.brandbar .logo .mark{width:34px;height:34px;border-radius:50%;background:#fff var(--logo) center/70% no-repeat;box-shadow:0 0 0 1px var(--line);}
.modeswitch{display:flex;gap:6px;background:#F1F1F8;padding:4px;border-radius:99px;border:1px solid var(--line);flex:0 0 auto;}
.modeswitch button{border:none;background:transparent;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);}
.modeswitch button.active{background:var(--primary);color:#fff;}

.layout{display:flex;gap:22px;align-items:flex-start;justify-content:center;}

/* ---------- site frame (was phone frame) ---------- */
#phoneWrap{flex:1 1 auto;min-width:0;width:100%;}
#phone{
  width:100%;background:var(--surface);border-radius:20px;
  box-shadow:0 30px 60px -30px rgba(20,20,60,.25);
  border:1px solid var(--line);
  overflow:visible;position:relative;display:flex;flex-direction:column;
}
#screen{flex:1;display:flex;flex-direction:column;background:transparent;}
#tabbar{display:flex;gap:4px;flex:1 1 auto;flex-wrap:wrap;justify-content:center;}
#tabbar button{background:none;border:none;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);padding:9px 14px;border-radius:10px;position:relative;white-space:nowrap;}
#tabbar button:hover{background:#F4F4FB;color:var(--ink);}
#tabbar button.active{color:var(--primary);background:#EFEEFC;}
#tabbar .ic{font-size:16px;}
.badge-dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid #fff;}
@media (min-width:901px){

/* =========================================================
   RENDER ROOT
   ========================================================= */
function go(page, extra){ S.page = page; if(extra) Object.assign(S, extra); render(); window.scrollTo?.(0,0); const scr=document.getElementById('screen'); if(scr) scr.scrollTop=0; }
function setMode(m){ S.mode=m; document.getElementById('btnUserMode').classList.toggle('active',m==='user'); document.getElementById('btnAdminMode').classList.toggle('active',m==='admin'); document.getElementById('phoneWrap').style.display = m==='user'?'block':'none'; document.getElementById('admin').style.display = m==='admin'?'flex':'none'; if(m==='admin') renderAdmin(); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function pushNotif(title,body,type){ S.notifications.unshift({id:Date.now(),title,body,time:'Just now',read:false,type:type||'info'}); }
function unreadCount(){ return S.notifications.filter(n=>!n.read).length; }

function render(){
  const scr = document.getElementById('screen');
  const tb = document.getElementById('tabbar');
  scr.innerHTML = pageHTML();
  tb.style.display = (S.user && !['checkout','result','productDetail','foodRestaurant','movieSeats','billpay','listingDetail','sellItem','rideStatus','propertyDetail'].includes(S.page)) ? 'flex' : (S.user? 'flex':'none');
  tb.innerHTML = S.user ? tabbarHTML() : '';
  attachHandlers();
}

/* =========================================================
   TAB BAR
   ========================================================= */
function tabbarHTML(){
  const tabs = [
    {id:'home',ic:'🏠',lbl:'Home'},
    {id:'ecommerce',ic:'🛍️',lbl:'Shopping'},
    {id:'food',ic:'🍔',lbl:'Food'},
    {id:'rides',ic:'🚕',lbl:'Cabs'},
    {id:'movies',ic:'🎬',lbl:'Movies'},
    {id:'activity',ic:'🧾',lbl:'Activity'},
    {id:'notifications',ic:'🔔',lbl:'Alerts'},
    {id:'profile',ic:'👤',lbl:'Profile'},
  ];
  const activePage = ['home'].includes(S.page)?'home': (['activity','orders','bookings','transactions'].includes(S.page)?'activity': S.page);
  return tabs.map(t=>`
    <button class="${activePage===t.id?'active':''}" onclick="go('${t.id==='activity'?'activity':t.id}')">
      <span class="ic">${t.ic}</span>${t.lbl}
      ${t.id==='notifications' && unreadCount()>0 ? '<span class="badge-dot"></span>':''}
    </button>`).join('');
}

function nowStamp(){
  const d = new Date();
  const date = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  const time = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  return `${date}, ${time}`;
}
function recordLoginSession(user){
  S.userSessions.unshift({name:user.name, email:user.email, device:'Web · This session', loginAt:nowStamp(), logoutAt:null, status:'Active'});
}
function recordLogoutSession(user){
  const s = S.userSessions.find(s=>s.email===user.email && s.status==='Active');
  if(s){ s.status='Logged out'; s.logoutAt=nowStamp(); }
}
function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();

  S.authErr='';
  S.user = {name:'Aditi Verma', email, phone:'+91 98765 43210', role:'Customer', kyc:'Verified', joined:'14 Sep 2026'};
  recordLoginSession(S.user);
  pushNotif('Login successful','Welcome back to SuperApp.','system');
  go('home');
}
function doSignup(){
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const phone = document.getElementById('suPhone').value.trim();
  const pass = document.getElementById('suPass').value.trim();
  if(!name||!email||!phone||!pass){ S.authErr='All fields are required.'; render(); return; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ S.authErr='Enter a valid email address.'; render(); return; }
  if(pass.length<6){ S.authErr='Password must be at least 6 characters.'; render(); return; }
  S.authErr='';
  S.user = {name, email, phone, role:'Customer', kyc:'Pending', joined:'14 Sep 2026'};
  S.wallet.balance = 0;
  recordLoginSession(S.user);
  pushNotif('Account created','Verify your KYC to unlock wallet and bookings.','system');
  go('home');
}

/* =========================================================
   SHARED: deterministic mock distance/route (mirrors the backend's
   Maps service — same "hash the text, derive a stable value" trick used
   server-side for geocode/route so demo numbers don't jump around).
   ========================================================= */
function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function mockRoute(origin, dest){
  if(!origin || !dest) return null;
  const seed = hashSeed((origin+'|'+dest).toLowerCase());
  const distance_km = Math.round((2 + (seed%1200)/100) * 10)/10; // 2.0 – 14.0 km
  const duration_min = Math.max(4, Math.round(distance_km/28*60));
  return {distance_km, duration_min};
}

function payMethodsHTML(ck){
  const methods = [
    {id:'wallet', label:'SuperApp Wallet', sub:`Balance: ${fmt(S.wallet.balance)}`, disabled: !ck.allowWallet || S.wallet.balance<ck.amount},
    {id:'upi', label:'UPI', sub:'Google Pay, PhonePe, Paytm UPI', disabled:false},
    {id:'card', label:'Credit / Debit card', sub:'Visa, Mastercard, RuPay', disabled:false},
    {id:'netbanking', label:'Net banking', sub:'All major banks', disabled:false},
  ];
  return methods.map(m=>`
    <div class="paymethod ${payMethod===m.id?'sel':''}" style="${m.disabled?'opacity:.45;pointer-events:none;':''}" onclick="selectPayMethod('${m.id}')">
      <div><div style="font-size:13px;font-weight:600;">${m.label}</div><div style="font-size:11px;color:var(--muted);">${m.sub}${m.disabled && m.id==='wallet' ? ' — insufficient balance':''}</div></div>
      <div class="radio ${payMethod===m.id?'on':''}"></div>
    </div>`).join('');
}
function selectPayMethod(id){ payMethod=id; document.getElementById('payMethods').innerHTML = payMethodsHTML(S.checkout); }

function processPayment(){
  const ck = S.checkout;
  const amount = ck.amount;
  // mirrors the real MockPaymentGateway: exact amount of 13 simulates a decline
  const isTestFailure = Number(amount) === 13;
  const randomFailure = !isTestFailure && Math.random() < 0.06;
  const success = !isTestFailure && !randomFailure;

  if(payMethod==='wallet'){
    if(S.wallet.balance < amount){ toast('Insufficient wallet balance'); return; }
  }

  const txnId = uid();
  const now = nowStr();

  if(success){
    if(payMethod==='wallet'){ S.wallet.balance -= amount; }
    S.txns.unshift({
      reference_id:txnId, txn_type: ck.kind==='addmoney' ? 'credit':'debit',
      source: ck.kind==='addmoney'?'add_money':'payment',
      amount, status:'success', note: ck.kind==='addmoney' ? 'Added to wallet via '+methodLabel() : ck.title,
      created_at: now
    });
    if(ck.kind==='addmoney'){ S.wallet.balance += amount; }
    if(ck.kind==='ecommerce'){
      S.orders.unshift({id:txnId, kind:'ecommerce', title:`Order · ${ck.lines.length} item(s)`, sub: ck.lines.map(l=>l.p.name).join(', '), amount, status:'confirmed', date:now});
      S.cart = [];
    } else if(ck.kind==='food'){
      S.orders.unshift({id:txnId, kind:'food', title:'Food order', sub: ck.lines.map(l=>l.item.name+' × '+l.qty).join(', '), amount, status:'confirmed', date:now});
      S.foodCart = [];
    } else if(ck.kind==='medicines'){
      S.orders.unshift({id:txnId, kind:'medicines', title:'Pharmacy order', sub: ck.lines.map(l=>l.item.name+' × '+l.qty).join(', '), amount, status:'confirmed', date:now});
      S.medCart = [];
    } else if(['movies','healthcare','travel'].includes(ck.kind)){
      S.bookings.unshift({id:txnId, kind:ck.kind, title:ck.title, sub: ck.meta?Object.values(ck.meta).join(' · '):'', amount, status:'confirmed', date:now});
      if(ck.kind==='movies') S.moviesSel={movieId:S.detailMovie, show:CATALOG.movies.find(m=>m.id===S.detailMovie).shows[0], seats:[]};
    } else if(ck.kind==='education'){
      S.bookings.unshift({id:txnId, kind:'education', title:'Enrolled: '+ck.meta.course, sub:ck.meta.provider, amount, status:'confirmed', date:now});
    } else if(ck.kind==='bills'){
      S.bookings.unshift({id:txnId, kind:'bills', title:'Bill paid: '+ck.meta.biller, sub:'', amount, status:'confirmed', date:now});
    } else if(ck.kind==='homeService'){
      S.bookings.unshift({id:txnId, kind:'homeService', title:ck.title, sub: ck.meta?Object.values(ck.meta).join(' · '):'', amount, status:'confirmed', date:now});
    }
    pushNotif(ck.kind==='addmoney'?'Money added':'Payment successful', `${ck.title} — ${fmt(amount)} paid via ${methodLabel()}. Ref ${txnId}.`, 'payment');
  } else {
    S.txns.unshift({reference_id:txnId, txn_type:'debit', source: ck.kind==='addmoney'?'add_money':'payment', amount, status:'failed', note: (isTestFailure? 'Card declined (test)':'Payment failed') + ' — ' + ck.title, created_at: now});
    pushNotif('Payment failed', `${ck.title} — ${fmt(amount)} could not be processed. No amount was deducted.`, 'payment');
  }

  S.lastResult = {success, txnId, ck, amount, method: methodLabel(), reason: isTestFailure? 'Card declined (test amount ₹13)':'Payment declined by bank'};
  go('result');
}
function methodLabel(){ return {wallet:'SuperApp Wallet', upi:'UPI', card:'Card', netbanking:'Net Banking'}[payMethod]||payMethod; }

  ${gcModalHTML(key)}`;
}
function gcModalHTML(key){
  const m = S.gc.modal;
  if(!m || m.entity!==key) return '';
  const cfg = GC_CONFIGS[key];
  if(m.mode==='confirm-delete'){
    return `<div class="pm-overlay" onclick="if(event.target===this) gcClose();">
      <div class="pm-modal" style="max-width:400px;text-align:center;">
        <div style="font-size:34px;margin-bottom:10px;">🗑️</div>
        <h3 style="margin-bottom:8px;">Delete this ${cfg.label.toLowerCase()}?</h3>
        <div style="font-size:13px;color:var(--muted);margin-bottom:18px;">This cannot be undone.</div>
        <div class="pm-modal-foot" style="justify-content:center;">
          <button class="btn btn-ghost" style="width:auto;" onclick="gcClose()">Cancel</button>
          <button class="btn btn-primary" style="width:auto;background:var(--danger);" onclick="gcConfirmDelete()">Delete</button>
        </div>
      </div>
    </div>`;
  }
  const item = m.mode==='edit' ? cfg.getList().find(x=>x[cfg.idField]===m.id) : {};
  if(m.mode==='edit' && !item) return '';
  return `<div class="pm-overlay" onclick="if(event.target===this) gcClose();">
    <div class="pm-modal">
      <div class="pm-modal-head"><h3>${m.mode==='add'?'Add':'Edit'} ${cfg.label}</h3><button onclick="gcClose()">✕</button></div>
      <div class="pm-formgrid">
        ${cfg.fields.map(f=>{
          const raw = item[f.key];
          const val = raw!==undefined ? raw : (f.default!==undefined?f.default:'');
          const displayVal = Array.isArray(val) ? val.join(', ') : val;
          if(f.type==='select'){
            const opts = typeof f.options==='function' ? f.options() : f.options;
            return `<div class="${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label><select id="gc_${f.key}">${opts.map(o=>{const ov=(o&&o.value!==undefined)?o.value:o; const ol=(o&&o.label!==undefined)?o.label:o; return `<option value="${String(ov).replace(/"/g,'&quot;')}" ${String(displayVal)===String(ov)?'selected':''}>${ol}</option>`;}).join('')}</select></div>`;
          }
          if(f.type==='textarea'){
            return `<div class="full"><label>${f.label}${f.required?' *':''}</label><textarea id="gc_${f.key}" placeholder="${f.placeholder||''}">${displayVal}</textarea></div>`;
          }
          return `<div class="${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label><input id="gc_${f.key}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} value="${String(displayVal).replace(/"/g,'&quot;')}" placeholder="${f.placeholder||''}"></div>`;
        }).join('')}
      </div>
      <div class="pm-modal-foot">
        <button class="btn btn-ghost" style="width:auto;" onclick="gcClose()">Cancel</button>
        <button class="btn btn-primary" style="width:auto;" onclick="gcSave('${key}')">${m.mode==='add'?'Add '+cfg.label.toLowerCase():'Save changes'}</button>
      </div>
    </div>
  </div>`;
}
function gcOpenAdd(key){ S.gc.modal={entity:key, mode:'add'}; renderAdmin(); }
function gcOpenEdit(key,id){ S.gc.modal={entity:key, mode:'edit', id}; renderAdmin(); }
function gcDelete(key,id){ S.gc.modal={entity:key, mode:'confirm-delete', id}; renderAdmin(); }
function gcClose(){ S.gc.modal=null; renderAdmin(); }
function gcConfirmDelete(){
  const cfg = GC_CONFIGS[S.gc.modal.entity];
  const list = cfg.getList();
  const idx = list.findIndex(x=>x[cfg.idField]===S.gc.modal.id);
  if(idx>-1) list.splice(idx,1);
  S.gc.modal=null;
  toast(cfg.label+' deleted.');
  renderAdmin();
}
function gcSave(key){
  const cfg = GC_CONFIGS[key];
  const data = {};
  let valid = true;
  cfg.fields.forEach(f=>{
    const el = document.getElementById('gc_'+f.key);
    let v = el.value;
    if(f.type==='number'){
      const n = v===''?NaN:Number(v);
      if(f.required && (isNaN(n) || n<0)) valid=false;
      data[f.key] = isNaN(n) ? 0 : n;
    } else if(f.multi){
      const arr = v.split(',').map(s=>s.trim()).filter(Boolean);
      if(f.required && !arr.length) valid=false;
      data[f.key] = arr;
    } else {
      v = v.trim();
      if(f.required && !v) valid=false;
      data[f.key] = v;
    }
  });
  if(!valid){ toast('Please fill in all required fields with valid values.'); return; }
  const list = cfg.getList();
  if(S.gc.modal.mode==='add'){
    const base = cfg.defaults ? cfg.defaults(data) : {};
    const newItem = Object.assign({[cfg.idField]: cfg.genId(data)}, base, data);
    list.unshift(newItem);
    toast(cfg.label+' added.');
  } else {
    const item = list.find(x=>x[cfg.idField]===S.gc.modal.id);
    if(item) Object.assign(item, data);
    toast(cfg.label+' updated.');
  }
  S.gc.modal=null;
  renderAdmin();
}

function revenueByService(){
  const rev = {Shopping:0, Food:0, Movies:0, Rides:0, Housing:0, Healthcare:0, Education:0, Travel:0, Bills:0};
  S.orders.forEach(o=>{ if(o.kind==='ecommerce') rev.Shopping+=o.amount; if(o.kind==='food') rev.Food+=o.amount; if(o.kind==='medicines') rev.Healthcare+=o.amount; });
  S.bookings.forEach(b=>{
    if(b.kind==='movies') rev.Movies+=b.amount;
    if(b.kind==='healthcare') rev.Healthcare+=b.amount;
    if(b.kind==='education') rev.Education+=b.amount;
    if(b.kind==='travel') rev.Travel+=b.amount;
    if(b.kind==='bills') rev.Bills+=b.amount;
    if(b.kind==='rides') rev.Rides+=b.amount;
    if(b.kind==='homeService') rev.Housing+=b.amount;
  });
  // seed baseline so the chart isn't empty on first load
  const baseline = {Shopping:18400, Food:9200, Movies:6600, Rides:14600, Housing:7800, Healthcare:4100, Education:5200, Travel:11200, Bills:3200};
  Object.keys(rev).forEach(k=> rev[k]+=baseline[k]);
  return rev;

function pmRemoveBulkRow(k){ S.pmBulkRows = S.pmBulkRows.filter(r=>r._key!==k); renderAdmin(); }
function pmStockStep(d){ const el=document.getElementById('pmStockInput'); el.value = Math.max(0, Number(el.value||0)+d); }
function pmReadForm(prefix, key){
  const g = f => document.getElementById(prefix + f + (key?('_'+key):''));
  const nameRaw = (g('Name')?.value||'').trim();
  const skuRaw = (g('Sku')?.value||'').trim();
  const category = g('Category')?.value || '';
  const priceRaw = (g('Price')?.value||'').trim();
  const stockRaw = (g('Stock')?.value||'').trim();
  const descRaw = (g('Description')?.value||'').trim();
  const imagesRaw = (g('Images')?.value||'').trim();
  return {
    name:nameRaw, sku:skuRaw, category, price:Number(priceRaw), stock:Number(stockRaw), description:descRaw,
    images: imagesRaw ? imagesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [],
    _priceRaw:priceRaw, _stockRaw:stockRaw,
    _blank: !nameRaw && !skuRaw && !descRaw && !priceRaw && !stockRaw && !imagesRaw
  };
}
function pmValidate(d){
  if(!d.name || !d.sku || !d.category || !d.description) return false;
  if(d._priceRaw==='' || isNaN(d.price) || d.price<0) return false;
  if(d._stockRaw==='' || isNaN(d.stock) || d.stock<0) return false;
  return true;
}
function pmSaveProduct(){
  const d = pmReadForm('pm', null);
  if(!pmValidate(d)){ toast('Please fill in all required fields with valid values.'); return; }
  const mode = S.pmModal.mode;
  if(mode==='add'){
    if(S.pmProducts.some(p=>p.sku.toLowerCase()===d.sku.toLowerCase())){ toast('A product with this SKU already exists.'); return; }
    S.pmProducts.unshift({id:pmGenId(), name:d.name, sku:d.sku, category:d.category, price:d.price, stock:d.stock, description:d.description, images:d.images});
    toast('Product added.');
  } else {
    const p = S.pmProducts.find(x=>x.id===S.pmModal.id);
    if(!p){ S.pmModal=null; renderAdmin(); return; }
    if(S.pmProducts.some(x=>x.id!==p.id && x.sku.toLowerCase()===d.sku.toLowerCase())){ toast('A product with this SKU already exists.'); return; }
    Object.assign(p, {name:d.name, sku:d.sku, category:d.category, price:d.price, stock:d.stock, description:d.description, images:d.images});
    toast('Product updated.');
  }
  S.pmModal=null;
  renderAdmin();
}
function pmSaveBulkProducts(){
  let added=0, skipped=0;
  const newOnes=[];
  S.pmBulkRows.forEach(r=>{
    const d = pmReadForm('bulk', r._key);
    if(d._blank) return;
    if(!pmValidate(d)){ skipped++; return; }
    const dup = S.pmProducts.some(p=>p.sku.toLowerCase()===d.sku.toLowerCase()) || newOnes.some(p=>p.sku.toLowerCase()===d.sku.toLowerCase());
    if(dup){ skipped++; return; }
    newOnes.push({id:pmGenId(), name:d.name, sku:d.sku, category:d.category, price:d.price, stock:d.stock, description:d.description, images:d.images});
    added++;
  });
  if(added===0){ toast(skipped ? `No products added — ${skipped} row(s) had missing, invalid or duplicate fields.` : 'Fill in at least one row before saving.'); return; }
  S.pmProducts.unshift(...newOnes);
  S.pmModal=null;
  toast(`${added} product(s) added` + (skipped ? `, ${skipped} row(s) skipped.` : '.'));
  renderAdmin();
}
function pmAdjustStock(id, delta){
  const p = S.pmProducts.find(x=>x.id===id);
  if(!p) return;
  p.stock = Math.max(0, p.stock+delta);
  renderAdmin();
}
function pmSaveStock(){
  const p = S.pmProducts.find(x=>x.id===S.pmModal.id);
  if(!p) return;
  const val = Number(document.getElementById('pmStockInput').value);
  if(isNaN(val) || val<0){ toast('Enter a valid stock quantity.'); return; }
  p.stock = val;
  S.pmModal=null;
  toast('Stock updated.');
  renderAdmin();
}
function pmDeleteProduct(id){ S.pmModal={mode:'confirm-delete', id}; renderAdmin(); }
function pmConfirmDelete(){
  S.pmProducts = S.pmProducts.filter(p=>p.id!==S.pmModal.id);

}
